# Model configuration for DSAI Lab Project

model:
  # Base model architecture
  base_model: facebook/wav2vec2-base
  freeze_encoder: false  # Set to True if freezing base model

  # Architecture details
  hidden_size: 768
  num_layers: 12
  attention_heads: 12

  # CTC head
  ctc_loss: true
  ctc_loss_reduction: "mean"
  ctc_zero_infinity: true

  # Training configuration
  learning_rate: 3e-5
  warmup_steps: 200
  weight_decay: 0.005

  # Regularization
  dropout: 0.1
  feat_proj_dropout: 0.1
  attention_dropout: 0.1

  # Feature extraction
  mask_time_prob: 0.05
  layerdrop: 0.05

  # Decoding
  decoding: "greedy"  # or "beam_search" with language model
  beam_size: 5

# Evaluation configuration
evaluation:
  metrics: ["wer", "cer", "auroc", "ece"]
  snr_levels: ["clean", "20", "10", "5", "0"]
  max_len: 320  # frames