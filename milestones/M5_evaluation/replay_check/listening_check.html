<style>

function show(k){
  i = Math.max(0, Math.min(k, ROWS.length));

  const yes = Object.values(ans).filter(v=>v==='yes').length;
  document.getElementById('count').textContent = n+' of '+ROWS.length+' answered · yes: '+yes;
  const q = document.getElementById('q');
  if (i >= ROWS.length) { q.innerHTML = '<div class="done">All clips done: <b>'+yes+' / '+ROWS.length+'</b> heard ('+(100*yes/ROWS.length).toFixed(0)+' %). Target: at least 90 %. Click <b>Download filled CSV</b>.</div><div class="btns"><button onclick="show(0)">Review from start</button></div>'; return; }

}
